name: Commercial validation
on:
  push:
    branches: [feat/commercial-pilot]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yunji_ci
          POSTGRES_USER: yunji_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yunji_ci -d yunji_ci" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Real PostgreSQL API validation
        run: pnpm run test:api
        env:
          TEST_DATABASE_URL: postgresql://yunji_ci:isolated-ci-only@127.0.0.1:5432/yunji_ci
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-test-results
          path: test-results/commercial/
